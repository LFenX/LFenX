name: Profile metrics

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/metrics.yml'

concurrency:
  group: profile-metrics
  cancel-in-progress: false

permissions: {}

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check metrics access
        id: credentials
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          github-token: ${{ secrets.METRICS_TOKEN || github.token }}
          script: |
            core.setOutput('available', 'false');
            if (!process.env.METRICS_TOKEN) {
              core.notice('Configure a classic personal access token with repo scope as METRICS_TOKEN to include private repositories.');
              return;
            }
            const { data: account, headers } = await github.rest.users.getAuthenticated();
            if (account.login.toLowerCase() !== 'lfenx') {
              throw new Error('METRICS_TOKEN must belong to LFenX.');
            }
            const scopes = (headers['x-oauth-scopes'] || '').split(',').map(scope => scope.trim());
            if (!scopes.includes('repo')) {
              core.notice('METRICS_TOKEN needs repo scope before statistics can include all owned private repositories. The current card is preserved.');
              return;
            }
            const { viewer } = await github.graphql(`
              query OwnedRepositoryCoverage {
                viewer {
                  repositories(first: 100, affiliations: [OWNER], ownerAffiliations: [OWNER]) {
                    totalCount
                    pageInfo { hasNextPage }
                    nodes { name nameWithOwner isPrivate }
                  }
                }
              }
            `);
            const { nodes, totalCount, pageInfo } = viewer.repositories;
            for (const repository of nodes.filter(repository => repository.isPrivate)) {
              core.setSecret(repository.nameWithOwner);
              core.setSecret(repository.name);
            }
            if (pageInfo.hasNextPage || nodes.length !== totalCount) {
              throw new Error('Complete owned-repository coverage could not be verified. The current card is preserved.');
            }
            const privateCount = nodes.filter(repository => repository.isPrivate).length;
            core.info(`Owned repositories: ${totalCount} (${totalCount - privateCount} public, ${privateCount} private).`);
            core.setOutput('repositories', Math.max(totalCount, 1));
            core.setOutput('available', 'true');

      - name: Check WakaTime access
        id: wakatime
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_TOKEN }}
        with:
          script: |
            core.setOutput('available', 'false');
            const token = process.env.WAKATIME_TOKEN?.trim();
            if (!token) {
              core.notice('Configure WAKATIME_TOKEN with read_summaries to display WakaTime activity. GitHub statistics remain enabled.');
              return;
            }
            const dateParts = Object.fromEntries(new Intl.DateTimeFormat('en', {
              timeZone: 'Asia/Singapore', year: 'numeric', month: '2-digit', day: '2-digit'
            }).formatToParts(new Date()).map(part => [part.type, part.value]));
            const end = `${dateParts.year}-${dateParts.month}-${dateParts.day}`;
            const start = new Date(Date.parse(`${end}T00:00:00Z`) - 6 * 86400000).toISOString().slice(0, 10);
            const query = new URLSearchParams({start, end, timezone: 'Asia/Singapore'});
            let response;
            try {
              response = await fetch(`https://api.wakatime.com/api/v1/users/current/summaries?${query}`, {
                headers: {Authorization: `Bearer ${token}`}, signal: AbortSignal.timeout(30000)
              });
            } catch {
              throw new Error('WakaTime daily summaries could not be reached. The current card is preserved.');
            }
            if (!response.ok) {
              throw new Error(`WakaTime daily summaries returned HTTP ${response.status}. WAKATIME_TOKEN needs read_summaries. The current card is preserved.`);
            }
            let source;
            try { source = await response.json(); }
            catch { throw new Error('WakaTime returned an invalid summary response. The current card is preserved.'); }
            if (!Array.isArray(source.data) || source.data.length !== 7) {
              throw new Error('Seven daily WakaTime summaries are required. The current card is preserved.');
            }
            const days = source.data;
            const dates = new Set();
            for (const day of days) {
              const date = day.range?.date;
              if (!/^\d{4}-\d{2}-\d{2}$/.test(date || '') || date < start || date > end || dates.has(date)
                  || !Number.isFinite(day.grand_total?.total_seconds) || day.grand_total.total_seconds < 0) {
                throw new Error('WakaTime returned inconsistent summary dates or activity totals. The current card is preserved.');
              }
              dates.add(date);
            }
            const total = days.reduce((sum, day) => sum + day.grand_total.total_seconds, 0);
            if (Number.isFinite(source.cumulative_total?.seconds) && Math.abs(total - source.cumulative_total.seconds) > 1) {
              throw new Error('WakaTime cumulative and daily totals disagree. The current card is preserved.');
            }
            const number = value => Number.isFinite(value) && value >= 0 ? value : 0;
            const sumField = key => days.reduce((sum, day) => sum + number(day.grand_total[key]), 0);
            function series(key, activityTotal) {
              const sums = new Map();
              for (const day of days) {
                for (const item of day[key] || []) {
                  if (typeof item.name !== 'string' || !item.name.trim()) continue;
                  sums.set(item.name, (sums.get(item.name) || 0) + number(item.total_seconds));
                }
              }
              const denominator = activityTotal ?? [...sums.values()].reduce((sum, seconds) => sum + seconds, 0);
              return [...sums].filter(([, seconds]) => seconds > 0)
                .map(([name, seconds]) => ({name, seconds, percent: denominator ? seconds * 100 / denominator : 0}))
                .sort((a, b) => b.seconds - a.seconds || a.name.localeCompare(b.name));
            }
            const models = new Map();
            for (const day of days) {
              const metrics = day.grand_total;
              for (const key of new Set([...Object.keys(metrics.ai_model_line_changes || {}), ...Object.keys(metrics.ai_model_costs || {})])) {
                const model = models.get(key) || {name: key, lines: 0, cost: 0};
                model.lines += number(metrics.ai_model_line_changes?.[key]);
                model.cost += number(metrics.ai_model_costs?.[key]);
                models.set(key, model);
              }
            }
            const activeDays = days.filter(day => day.grand_total.total_seconds > 0).length;
            const daily = days.map(day => ({name: day.range.date, seconds: day.grand_total.total_seconds,
              percent: total ? day.grand_total.total_seconds * 100 / total : 0}));
            const payload = {
              start, end, total_seconds: total,
              today_seconds: days.find(day => day.range.date === end)?.grand_total.total_seconds || 0,
              daily_average: activeDays ? total / activeDays : 0, active_days: activeDays,
              best_day: [...daily].sort((a, b) => b.seconds - a.seconds)[0], daily,
              languages: series('languages'), editors: series('editors'), os: series('operating_systems'),
              categories: series('categories'), projects: series('projects', total),
              ai: Object.fromEntries(['ai_additions', 'ai_deletions', 'human_additions', 'human_deletions',
                'ai_input_tokens', 'ai_cached_input_tokens', 'ai_output_tokens', 'ai_prompt_events_total',
                'ai_prompt_length_sum', 'ai_sessions', 'ai_model_total_cost'].map(key => [key, sumField(key)])),
              models: [...models.values()].sort((a, b) => b.lines - a.lines || a.name.localeCompare(b.name))
            };
            core.setOutput('payload', Buffer.from(JSON.stringify(payload)).toString('base64'));
            core.setOutput('available', 'true');
            core.info(`WakaTime summaries verified: ${days.length} days, ${Math.floor(total / 3600)}h ${Math.floor(total % 3600 / 60)}m including today; ${payload.projects.length} active projects.`);

      - name: Generate GitHub metrics
        if: steps.credentials.outputs.available == 'true'
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          user: LFenX
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          committer_branch: main
          template: classic
          base: header, activity, community, repositories, metadata
          repositories: ${{ steps.credentials.outputs.repositories }}
          repositories_affiliations: owner
          repositories_forks: 'yes'
          config_timezone: Asia/Singapore
          config_animations: 'no'
          extras_js: |
            const contributionNote = [...document.querySelectorAll('footer > span')]
              .find(element => element.textContent.startsWith('These metrics '));
            contributionNote?.remove();
          plugin_languages: 'yes'
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          plugin_languages_indepth: 'no'
          plugin_languages_limit: 8
          plugins_errors_fatal: 'yes'
          retries: 2
          retries_delay: 30

      - name: Render WakaTime summaries
        id: render
        if: steps.credentials.outputs.available == 'true' && steps.wakatime.outputs.available == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          WAKATIME_PAYLOAD: ${{ steps.wakatime.outputs.payload }}
        with:
          script: |
            const data = JSON.parse(Buffer.from(process.env.WAKATIME_PAYLOAD, 'base64').toString('utf8'));
            const target = {...context.repo, path: 'github-metrics.svg', ref: 'main'};
            const {data: file} = await github.rest.repos.getContent(target);
            if (Array.isArray(file) || !file.content) throw new Error('The generated GitHub metrics SVG is required.');
            const original = Buffer.from(file.content, 'base64').toString('utf8');
            let svg = original.replace(/<!-- WAKATIME:START -->[\s\S]*?<!-- WAKATIME:END -->/g, '')
              .replace(/<style id="wakatime-summary-style"[\s\S]*?<\/style>/g, '');
            const root = svg.match(/<svg\b[^>]*>/)?.[0];
            const baseHeight = Number(root?.match(/data-wakatime-base-height="(\d+)"/)?.[1]
              || root?.match(/\bheight="(\d+)"/)?.[1]);
            if (!baseHeight || !svg.includes('<footer')) throw new Error('The classic metrics layout could not be verified.');
            const escape = value => String(value).replace(/[&<>"']/g, character => ({
              '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;'
            }[character]));
            const duration = seconds => {
              const minutes = Math.floor(seconds / 60);
              return minutes >= 60 ? `${Math.floor(minutes / 60)} hrs ${minutes % 60} mins` : `${minutes} mins`;
            };
            const compact = value => new Intl.NumberFormat('en', {notation: 'compact', maximumFractionDigits: 1}).format(value);
            const fields = [
              `Total: ${duration(data.total_seconds)}`, `Today: ${duration(data.today_seconds)}`,
              `Daily average: ${duration(data.daily_average)}`, `Active days: ${data.active_days} / 7`,
              `Best day: ${data.best_day.name}`, `Best day time: ${duration(data.best_day.seconds)}`,
              `AI line changes: ${compact(data.ai.ai_additions + data.ai.ai_deletions)}`,
              `Human line changes: ${compact(data.ai.human_additions + data.ai.human_deletions)}`,
              `AI added / removed: ${compact(data.ai.ai_additions)} / ${compact(data.ai.ai_deletions)}`,
              `Human added / removed: ${compact(data.ai.human_additions)} / ${compact(data.ai.human_deletions)}`,
              `AI input tokens: ${compact(data.ai.ai_input_tokens)}`, `Cached input: ${compact(data.ai.ai_cached_input_tokens)}`,
              `AI output tokens: ${compact(data.ai.ai_output_tokens)}`, `AI sessions: ${compact(data.ai.ai_sessions)}`,
              `AI prompts: ${compact(data.ai.ai_prompt_events_total)}`, `Estimated AI cost: $${data.ai.ai_model_total_cost.toFixed(2)}`,
              `Prompt characters: ${compact(data.ai.ai_prompt_length_sum)}`,
              `Average prompt: ${Math.round(data.ai.ai_prompt_events_total ? data.ai.ai_prompt_length_sum / data.ai.ai_prompt_events_total : 0)} chars`
            ];
            const modelTotal = data.models.reduce((sum, model) => sum + model.lines, 0);
            const costTotal = data.models.reduce((sum, model) => sum + model.cost, 0);
            const charts = [
              ['Language activity', data.languages], ['Code editors', data.editors],
              ['Operating systems', data.os], ['Activity categories', data.categories],
              ['Active projects', data.projects], ['Daily activity', data.daily],
              ['AI models by line changes', data.models.map(model => ({name: model.name, percent: modelTotal ? model.lines * 100 / modelTotal : 0}))],
              ['Estimated AI cost by model', data.models.map(model => ({name: model.name, percent: costTotal ? model.cost * 100 / costTotal : 0, cost: model.cost}))]
            ];
            const layout = {heading: 24, field: 20, chartGap: 12, chartHeading: 24, entry: 20, top: 12, bottom: 8};
            let sectionHeight = layout.heading + Math.ceil(fields.length / 2) * layout.field;
            const chartMarkup = [];
            function projectLines(name) {
              const lines = [];
              let line = '', width = 0;
              for (const character of name) {
                const size = /[^\u0000-\u007f]/u.test(character) ? 14 : /[MW@#%]/.test(character) ? 12 : /[ilI.,'|! ]/.test(character) ? 4 : 9;
                if (line && width + size > 95) { lines.push(line); line = ''; width = 0; }
                line += character; width += size;
              }
              if (line || !lines.length) lines.push(line);
              return lines;
            }
            for (let index = 0; index < charts.length; index += 2) {
              const pair = charts.slice(index, index + 2);
              const pairHeights = pair.map(([title, entries]) => entries.length ? entries.reduce((sum, item) =>
                sum + (title === 'Active projects' ? projectLines(item.name).length : 1) * layout.entry, 0) : layout.entry);
              sectionHeight += layout.chartGap + layout.chartHeading + Math.max(...pairHeights);
              chartMarkup.push(`<div class="waka-chart-row">${pair.map(([title, entries]) =>
                `<div class="waka-chart"><h3>${escape(title)}</h3><div class="waka-bars">${entries.length ? entries.map(item => {
                  const percent = Math.max(0, Math.min(100, item.percent));
                  const value = item.cost === undefined ? `${percent.toFixed(2)}%` : `$${item.cost.toFixed(2)}`;
                  const lines = title === 'Active projects' ? projectLines(item.name) : [item.name];
                  const nameStyle = title === 'Active projects' ? ' style="white-space:normal;overflow:visible;text-overflow:clip"' : '';
                  return `<div class="entry" style="height:${lines.length * layout.entry}px" title="${escape(item.seconds === undefined ? value : duration(item.seconds))}"><span class="name" title="${escape(item.name)}"${nameStyle}>${lines.map(escape).join('<br/>')}</span><span class="waka-track"><span class="waka-bar" style="width:${percent.toFixed(4)}%"></span></span><span class="value">${escape(value)}</span></div>`;
                }).join('') : '<div class="waka-empty">No activity in this period</div>'}</div></div>`
              ).join('')}</div>`);
            }
            const style = `<style id="wakatime-summary-style" type="text/css"><![CDATA[
            .wakatime-summary{display:block!important;box-sizing:border-box;margin:${layout.top}px 0 0!important;padding:0!important;height:${sectionHeight}px;font-family:inherit;font-size:13px;line-height:20px;color:inherit}
            .wakatime-summary h2{height:${layout.heading}px;line-height:${layout.heading}px;padding:0!important;margin:0!important;font-size:16px;font-weight:400;color:#00f}
            .wakatime-summary .waka-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:12px}
            .wakatime-summary .waka-field{height:${layout.field}px;line-height:${layout.field}px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
            .wakatime-summary .waka-chart-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:12px;margin-top:${layout.chartGap}px}
            .wakatime-summary h3{height:${layout.chartHeading}px;line-height:${layout.chartHeading}px;margin:0!important;padding:0!important;font-size:13px;font-weight:400;color:#00f}
            .wakatime-summary .entry{display:grid;grid-template-columns:minmax(0,95px) minmax(0,1fr) 43px;column-gap:4px;height:${layout.entry}px;line-height:${layout.entry}px;margin:0;padding:0;align-items:center}
            .wakatime-summary .name{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
            .wakatime-summary .value{text-align:right;white-space:nowrap;font-size:11px}
            .wakatime-summary .waka-track{display:block;height:7px;border-radius:2px;background:rgba(68,149,74,.12)}
            .wakatime-summary .waka-bar{display:block;height:7px;border-radius:2px;background:#44954a}
            .wakatime-summary .waka-empty{height:${layout.entry}px;line-height:${layout.entry}px;font-size:12px}
            ]]></style>`;
            const markup = `<!-- WAKATIME:START --><section class="wakatime-summary"><h2>WakaTime (last 7 days, including today)</h2><div class="waka-fields">${fields.map(field => `<div class="waka-field" title="${escape(field)}">${escape(field)}</div>`).join('')}</div>${chartMarkup.join('')}</section><!-- WAKATIME:END -->`;
            const height = baseHeight + layout.top + sectionHeight + layout.bottom;
            svg = svg.replace(/<svg\b[^>]*>/, tag => {
              let updated = tag.replace(/\bwidth="\d+"/, 'width="480"').replace(/\bheight="\d+"/, `height="${height}"`);
              updated = updated.replace(/\sviewBox="[^"]*"/, '');
              if (!updated.includes('data-wakatime-base-height=')) updated = updated.replace(/>$/, ` data-wakatime-base-height="${baseHeight}">`);
              return updated.replace(/>$/, ` viewBox="0 0 480 ${height}">`);
            }).replace('</defs>', `</defs>${style}`).replace('<footer', `${markup}<footer`);
            if (!svg.includes('class="wakatime-summary"') || !svg.includes(`Total: ${duration(data.total_seconds)}`)) {
              throw new Error('The completed WakaTime card did not pass its content check.');
            }
            let revision;
            if (svg !== original) {
              const {data: saved} = await github.rest.repos.createOrUpdateFileContents({
                ...context.repo, path: target.path, branch: 'main', sha: file.sha,
                message: 'Update WakaTime summaries in profile metrics [Skip GitHub Action]',
                content: Buffer.from(svg).toString('base64')
              });
              revision = saved.commit.sha;
            } else {
              const {data: commit} = await github.rest.repos.getCommit({...context.repo, ref: 'main'});
              revision = commit.sha;
            }
            core.setOutput('revision', revision);
            core.info(`Published WakaTime summaries: ${duration(data.total_seconds)} including today; ${charts.length} complete distributions; ${data.projects.length} active projects; original two-column layout.`);

      - name: Add generated metrics to the profile
        if: steps.credentials.outputs.available == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const generatedRevision = '${{ steps.render.outputs.revision }}';
            const repo = { ...context.repo, ref: generatedRevision || 'main' };
            const { data: metrics } = await github.rest.repos.getContent({
              ...repo, path: 'github-metrics.svg'
            });
            if (Array.isArray(metrics) || metrics.type !== 'file' || !metrics.size) {
              throw new Error('A generated metrics image is required before updating the README.');
            }
            const originalImage = Buffer.from(metrics.content, 'base64').toString('utf8');
            const footer = originalImage.match(/<footer\b[^>]*>[\s\S]*?<\/footer>/)?.[0];
            const updatedAt = footer?.match(/Last updated ([^<()]+) \((?:timezone Asia\/Singapore|Singapore time, UTC\+08:00)\)/)?.[1];
            if (!updatedAt) {
              throw new Error('The generated footer must use Asia/Singapore.');
            }
            const image = originalImage.replace(footer,
              `<footer><span>Last updated ${updatedAt} (Singapore time, UTC+08:00)</span></footer>`);
            if ('${{ steps.wakatime.outputs.available }}' === 'true') {
              if (!image.includes('class="wakatime-summary"') || !image.includes('including today')) {
                throw new Error('The WakaTime section is missing from the generated card.');
              }
            }
            let imageRevision = generatedRevision;
            if (image !== originalImage) {
              const { data: savedImage } = await github.rest.repos.createOrUpdateFileContents({
                ...context.repo, path: 'github-metrics.svg', branch: 'main', sha: metrics.sha,
                message: 'Keep the Singapore-time profile footer [Skip GitHub Action]',
                content: Buffer.from(image).toString('base64')
              });
              imageRevision = savedImage.commit.sha;
            }
            core.info('Profile footer verified: Singapore time (UTC+08:00); contribution note removed.');
            if (!imageRevision) {
              const { data: revision } = await github.rest.repos.getCommit({...context.repo, ref: 'main'});
              imageRevision = revision.sha;
            }
            const { data: file } = await github.rest.repos.getContent({
              ...repo, path: 'README.md'
            });
            if (Array.isArray(file) || file.type !== 'file' || !file.content) {
              throw new Error('README.md is not an editable file.');
            }
            const readme = Buffer.from(file.content, 'base64').toString('utf8');
            const imageReference = `![GitHub metrics](https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${imageRevision}/github-metrics.svg)`;
            const existingImage = /!\[GitHub metrics\]\([^)]+\)/;
            const updated = existingImage.test(readme)
              ? readme.replace(existingImage, imageReference)
              : readme.trimEnd() + '\n\n' + imageReference + '\n';
            if (updated !== readme) {
              await github.rest.repos.createOrUpdateFileContents({
                ...context.repo,
                path: 'README.md',
                branch: 'main',
                sha: file.sha,
                message: 'Display generated profile metrics',
                content: Buffer.from(updated).toString('base64')
              });
            }
